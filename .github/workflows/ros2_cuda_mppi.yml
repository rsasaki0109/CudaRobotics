jobs:
  compile:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA compiler (no driver)
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 \
            cuda-cudart-dev-12-6 \
            libcurand-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-12.6/bin/nvcc --version

      - name: Install ROS 2 Jazzy and Nav2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gnupg \
            lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-pil \
            python3-colcon-common-extensions \
            ros-jazzy-ros-base \
            ros-jazzy-nav2-core \
            ros-jazzy-nav2-controller \
            ros-jazzy-nav2-costmap-2d \
            ros-jazzy-nav2-msgs \
            ros-jazzy-nav2-util \
            ros-jazzy-nav2-mppi-controller \
            ros-jazzy-ros2bag \
            ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-rosidl-default-generators

      - name: Compile CudaNav interfaces, odometry, and controller
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select cuda_robotics_msgs cuda_robotics_common cuda_kiss_icp cuda_voxel_mapping cuda_esdf cuda_voxel_costmap_layer cuda_mppi_controller cuda_nav_bringup \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Run no-GPU runtime smoke tests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          python ../scripts/test_cudanav_contract.py
          python ../scripts/test_cudanav_evidence.py
          python ../scripts/test_cudanav_multi_gpu.py
          python ../scripts/test_cudanav_rosbag_evidence.py
          python ../scripts/test_cudanav_autonomy_suite.py
          python ../scripts/test_cudanav_ros_ci_evidence.py
          python ../scripts/test_cudanav_real_dataset.py
          python ../scripts/test_prepare_cudanav_istanbul_dataset.py
          python ../scripts/test_run_cudanav_real_dataset_pipeline.py
          python ../scripts/test_derive_cudanav_path_sidecar.py
          python ../scripts/test_analyze_pointcloud2_clearance.py
          python ../scripts/test_evaluate_mppi_rosbag.py
          python ../scripts/test_derive_cudanav_path_sidecar_ros.py
          python ../scripts/test_publish_cudanav_systems_evidence.py
          python ../scripts/test_publish_cudanav_dataset_evidence.py
          python ../scripts/test_cudanav_kiss_icp_real.py
          ros2 run cuda_voxel_costmap_layer plugin_load_test
          ros2 run cuda_mppi_controller plugin_load_test
          ros2 run cuda_mppi_controller parameter_validation_test
          colcon test --packages-select cuda_robotics_common cuda_kiss_icp cuda_voxel_mapping cuda_esdf cuda_voxel_costmap_layer cuda_nav_bringup \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Create ROS 2 Jazzy evidence attestation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -eo pipefail
          test -z "$(git status --porcelain)"
          CUDA_COMPILER=$(/usr/local/cuda-12.6/bin/nvcc --version | tail -n 1)
          python scripts/cudanav_ros_ci_evidence.py \
            --output build/ros_jazzy_ci_evidence.json \
            --runner-image ubuntu-24.04 \
            --ros-distro jazzy \
            --cuda-toolkit 12.6 \
            --cuda-compiler "$CUDA_COMPILER" \
            --package cuda_robotics_msgs \
            --package cuda_robotics_common \
            --package cuda_kiss_icp \
            --package cuda_voxel_mapping \
            --package cuda_esdf \
            --package cuda_voxel_costmap_layer \
            --package cuda_mppi_controller \
            --package cuda_nav_bringup \
            --check clean_checkout \
            --check colcon_build \
            --check python_evidence_contracts \
            --check costmap_plugin_load \
            --check controller_plugin_load \
            --check controller_parameter_validation \
            --check derived_path_sidecar_roundtrip \
            --check colcon_tests
          python scripts/validate_cudanav_ros_ci.py \
            build/ros_jazzy_ci_evidence.json

      - name: Upload ROS 2 Jazzy evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ros-jazzy-ci-evidence-${{ github.sha }}
          path: build/ros_jazzy_ci_evidence.json
          if-no-files-found: error
