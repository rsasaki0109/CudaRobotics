name: ROS2 CUDA MPPI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/ros2_cuda_mppi.yml
      - ros2_ws/src/cuda_robotics_msgs/**
      - ros2_ws/src/cuda_robotics_common/**
      - ros2_ws/src/cuda_kiss_icp/**
      - ros2_ws/src/cuda_voxel_mapping/**
      - ros2_ws/src/cuda_esdf/**
      - ros2_ws/src/cuda_mppi_controller/**
      - include/cudarobotics/kiss_icp_gpu.hpp
      - src/gpu_kiss_icp.cu
      - include/cudarobotics/voxel_mapping_gpu.hpp
      - src/voxel_mapping_gpu.cu
      - include/cudarobotics/esdf_2d_gpu.hpp
      - src/esdf_2d_gpu.cu
      - src/mppi_gpu.cu
      - include/cuda_mppi_controller/**
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/ros2_cuda_mppi.yml
      - ros2_ws/src/cuda_robotics_msgs/**
      - ros2_ws/src/cuda_robotics_common/**
      - ros2_ws/src/cuda_kiss_icp/**
      - ros2_ws/src/cuda_voxel_mapping/**
      - ros2_ws/src/cuda_esdf/**
      - ros2_ws/src/cuda_mppi_controller/**
      - include/cudarobotics/kiss_icp_gpu.hpp
      - src/gpu_kiss_icp.cu
      - include/cudarobotics/voxel_mapping_gpu.hpp
      - src/voxel_mapping_gpu.cu
      - include/cudarobotics/esdf_2d_gpu.hpp
      - src/esdf_2d_gpu.cu
      - src/mppi_gpu.cu
      - include/cuda_mppi_controller/**

jobs:
  compile:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA compiler (no driver)
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 \
            cuda-cudart-dev-12-6 \
            libcurand-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-12.6/bin/nvcc --version

      - name: Install ROS 2 Jazzy and Nav2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gnupg \
            lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-colcon-common-extensions \
            ros-jazzy-ros-base \
            ros-jazzy-nav2-core \
            ros-jazzy-nav2-costmap-2d \
            ros-jazzy-nav2-util \
            ros-jazzy-nav2-mppi-controller \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-rosidl-default-generators

      - name: Compile CudaNav interfaces, odometry, and controller
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select cuda_robotics_msgs cuda_robotics_common cuda_kiss_icp cuda_voxel_mapping cuda_esdf cuda_mppi_controller \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Run no-GPU runtime smoke tests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          ros2 run cuda_mppi_controller plugin_load_test
          ros2 run cuda_mppi_controller parameter_validation_test
          colcon test --packages-select cuda_robotics_common cuda_kiss_icp cuda_voxel_mapping cuda_esdf \
            --event-handlers console_direct+
          colcon test-result --verbose
