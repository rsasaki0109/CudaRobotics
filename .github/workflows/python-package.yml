name: Python package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "python/**"
      - "examples/colab/cudarobotics_quickstart.ipynb"
      - "examples/python/onboarding_quickstart.py"
      - "examples/python/mppi_dlpack_costmap.py"
      - "scripts/sync_python_core.sh"
      - "scripts/summarize_adoption_results.py"
      - "scripts/install_python_wheel.py"
      - "scripts/validate_python_onboarding.py"
      - "src/*_gpu.cu"
      - "include/cudarobotics/**"
      - "include/cuda_mppi_controller/**"
      - "include/cuda_check.cuh"
      - ".github/workflows/python-package.yml"
      - "scripts/release_ci_evidence.py"
      - "scripts/validate_release_ci.py"
      - "scripts/test_release_ci_evidence.py"
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "examples/colab/cudarobotics_quickstart.ipynb"
      - "examples/python/onboarding_quickstart.py"
      - "examples/python/mppi_dlpack_costmap.py"
      - "scripts/sync_python_core.sh"
      - "scripts/summarize_adoption_results.py"
      - "scripts/install_python_wheel.py"
      - "scripts/validate_python_onboarding.py"
      - "src/*_gpu.cu"
      - "include/cudarobotics/**"
      - "include/cuda_mppi_controller/**"
      - "include/cuda_check.cuh"
      - ".github/workflows/python-package.yml"
      - "scripts/release_ci_evidence.py"
      - "scripts/validate_release_ci.py"
      - "scripts/test_release_ci_evidence.py"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: "12.0.0"
          method: network

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync bundled CUDA core
        run: ./scripts/sync_python_core.sh

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build python/ --outdir python/dist

      - name: Install from sdist and run tests
        run: |
          python -m venv /tmp/cudarobotics-test-venv
          SDIST=(python/dist/cudarobotics-*.tar.gz)
          /tmp/cudarobotics-test-venv/bin/pip install "${SDIST[0]}[test]"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            /tmp/cudarobotics-test-venv/bin/pytest \
              python/tests -m "not gpu_registration" -q

      - name: Upload wheels
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cudarobotics-wheels
          path: python/dist/*

  cibuildwheel:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sync bundled CUDA core
        run: ./scripts/sync_python_core.sh

      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp310-* cp312-*
          CIBW_SKIP: pp* *musllinux* *win32 *macosx* *i686*
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            yum install -y yum-utils
            yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            yum install -y --setopt=obsoletes=0 cuda-nvcc-12-0 cuda-cudart-devel-12-0 libcurand-devel-12-0
          CIBW_ENVIRONMENT: >-
            CUDACXX=/usr/local/cuda/bin/nvcc
            CMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
        with:
          package-dir: python

      - name: Upload manylinux wheels
        uses: actions/upload-artifact@v4
        with:
          name: cudarobotics-manylinux-wheels
          path: wheelhouse/*

  release-evidence:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    needs: [build-and-test, cibuildwheel]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every package job
        env:
          BUILD_TEST_RESULT: ${{ needs.build-and-test.result }}
          CIBUILDWHEEL_RESULT: ${{ needs.cibuildwheel.result }}
        run: |
          test "$BUILD_TEST_RESULT" = success
          test "$CIBUILDWHEEL_RESULT" = success

      - uses: actions/checkout@v4

      - name: Download native wheel and sdist artifacts
        uses: actions/download-artifact@v4
        with:
          name: cudarobotics-wheels
          path: build/release_ci/dist

      - name: Download manylinux wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: cudarobotics-manylinux-wheels
          path: build/release_ci/dist

      - name: Create commit-bound Python package evidence
        run: |
          test -z "$(git status --porcelain)"
          python scripts/verify_python_release_artifacts.py \
            --dist-dir build/release_ci/dist \
            --json build/release_ci/python_artifacts.json \
            --require-clean
          python scripts/release_ci_evidence.py \
            --output build/release_ci/python_package_ci_evidence.json \
            --gate python_manylinux_wheels \
            --workflow "$GITHUB_WORKFLOW" \
            --check python_3_10_3_12_build_test \
            --check sdist_and_native_wheel \
            --check manylinux_cp310_cp312 \
            --check artifacts_uploaded \
            --artifact cudarobotics-wheels \
            --artifact cudarobotics-manylinux-wheels \
            --artifact-manifest build/release_ci/python_artifacts.json
          python scripts/validate_release_ci.py \
            build/release_ci/python_package_ci_evidence.json \
            --gate python_manylinux_wheels \
            --commit "$GITHUB_SHA"

      - name: Upload commit-bound Python package evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-package-ci-evidence-${{ github.sha }}
          path: |
            build/release_ci/python_package_ci_evidence.json
            build/release_ci/python_artifacts.json
          if-no-files-found: error
