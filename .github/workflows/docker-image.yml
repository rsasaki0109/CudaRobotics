name: docker-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build stage (nvcc + nav2) is large; reclaim runner disk first.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/cuda-mppi-controller-demo
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify end-to-end CudaNav packages in pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cuda-mppi-controller-demo:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --entrypoint bash "$IMAGE" -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            source /ws/install/setup.bash
            for package in \
              cuda_robotics_msgs cuda_robotics_common cuda_kiss_icp \
              cuda_voxel_mapping cuda_esdf cuda_voxel_costmap_layer \
              cuda_mppi_controller cuda_nav_bringup; do
              ros2 pkg prefix "$package"
            done
            test -x \
              /ws/install/cuda_mppi_controller/lib/cuda_mppi_controller/plugin_load_test
            test -f \
              /ws/install/cuda_nav_bringup/share/cuda_nav_bringup/launch/cudanav_closed_loop.launch.py
          '
