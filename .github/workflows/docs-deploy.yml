name: Docs deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docs/site/**"
      - "docs/v1_support_matrix.json"
      - "gif/*.gif"
      - "scripts/v1_support_matrix.py"
      - ".github/workflows/docs-deploy.yml"
      - "scripts/test_browser_mppi.mjs"
      - "scripts/test_browser_mppi_webgpu.mjs"
      - "scripts/test_browser_particles*.mjs"
      - "scripts/test_browser_navigation*.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Check out existing gallery tree
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and stage docs without replacing gallery
        env:
          WEBGPU_MODULE: ${{ runner.temp }}/browser-mppi/node_modules/webgpu/index.js
        run: |
          python3 source/scripts/validate_v1_support_matrix.py
          node --test source/scripts/test_browser_mppi.mjs source/scripts/test_browser_particles.mjs source/scripts/test_browser_navigation.mjs source/scripts/test_browser_navigation_benchmark.mjs
          npm install --prefix "$RUNNER_TEMP/browser-mppi" --no-audit --no-fund webgpu@0.6.2
          node source/scripts/test_browser_mppi_webgpu.mjs --compile-only
          node source/scripts/test_browser_particles_webgpu.mjs --compile-only
          node source/scripts/test_browser_navigation_webgpu.mjs --compile-only
          test -f pages/index.html
          test -d pages/gif
          rsync -a --delete source/docs/site/ pages/docs/
          rsync -a \
            --include='*.gif' --exclude='*' \
            source/gif/ pages/
          for page in index.html install.html nav2.html results.html demo/index.html demo/app.mjs demo/planner.mjs demo/gpu.mjs demo/rollout.wgsl demo/demo.css particles/index.html particles/app.mjs particles/model.mjs particles/gpu.mjs particles/filter.wgsl particles/draw.wgsl particles/particles.css navigation/index.html navigation/app.mjs navigation/model.mjs navigation/gpu.mjs navigation/field.wgsl navigation/navigation.css navigation/benchmark.mjs; do
            cmp "source/docs/site/$page" "pages/docs/$page"
          done
          while IFS= read -r -d '' asset; do
            cmp "$asset" "pages/$(basename "$asset")"
          done < <(find source/gif -maxdepth 1 -type f -name '*.gif' -print0)
          rm -rf -- pages/.git

      - uses: actions/configure-pages@v5

      - name: Upload complete preserved Pages tree
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Re-fetch and compare public docs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            MATCHED=true
            for page in index.html install.html nav2.html results.html demo/index.html demo/app.mjs demo/planner.mjs demo/gpu.mjs demo/rollout.wgsl demo/demo.css particles/index.html particles/app.mjs particles/model.mjs particles/gpu.mjs particles/filter.wgsl particles/draw.wgsl particles/particles.css navigation/index.html navigation/app.mjs navigation/model.mjs navigation/gpu.mjs navigation/field.wgsl navigation/navigation.css navigation/benchmark.mjs; do
              mkdir -p "/tmp/$(dirname "$page")"
              curl --fail --silent --show-error \
                "${PAGE_URL}docs/${page}?source_commit=${SOURCE_COMMIT}" \
                --output "/tmp/${page}" || MATCHED=false
              cmp "source/docs/site/${page}" "/tmp/${page}" || MATCHED=false
            done
            if [ "$MATCHED" = true ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
