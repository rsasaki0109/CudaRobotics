name: Repo checks

# Fast checks that apply to every change, including docs-only ones that skip
# the CUDA build.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Check for physical GPU identities
        run: |
          python3 scripts/redact_gpu_identity.py --check
          python3 scripts/test_redact_gpu_identity.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test browser robotics references
        run: node --test scripts/test_browser_mppi.mjs scripts/test_browser_particles.mjs scripts/test_browser_navigation.mjs scripts/test_browser_navigation_benchmark.mjs scripts/test_browser_navigation_edt.mjs scripts/test_browser_comparisons.mjs scripts/test_browser_demo_inventory.mjs

      - name: Validate WebGPU shader without a physical GPU
        env:
          WEBGPU_MODULE: ${{ runner.temp }}/browser-mppi/node_modules/webgpu/index.js
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-mppi" --no-audit --no-fund webgpu@0.6.2
          node scripts/test_browser_mppi_webgpu.mjs --compile-only
          node scripts/test_browser_particles_webgpu.mjs --compile-only
          node scripts/test_browser_navigation_webgpu.mjs --compile-only
