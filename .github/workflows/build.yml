name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: "12.0.0"
          method: network

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libeigen3-dev \
            libopencv-dev \
            python3-matplotlib \
            python3-numpy

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      # GPU tests (label "gpu") require NVIDIA GPU and cannot run in CI

      - name: Run Python tests
        run: cd build && ctest --output-on-failure --label-regex python -j$(nproc)

      - name: Run CPU tests
        run: cd build && ctest --output-on-failure --label-regex cpu -j$(nproc)

      - name: Create commit-bound Build evidence
        if: github.event_name != 'pull_request'
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git clean -fdx
          test -z "$(git status --porcelain)"
          python scripts/release_ci_evidence.py \
            --output build/github_build_ci_evidence.json \
            --gate github_build \
            --workflow "$GITHUB_WORKFLOW" \
            --check clean_checkout \
            --check cmake_configure \
            --check cuda_build \
            --check python_ctest \
            --check cpu_ctest
          python scripts/validate_release_ci.py \
            build/github_build_ci_evidence.json \
            --gate github_build \
            --commit "$GITHUB_SHA"

      - name: Upload commit-bound Build evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-build-ci-evidence-${{ github.sha }}
          path: build/github_build_ci_evidence.json
          if-no-files-found: error
