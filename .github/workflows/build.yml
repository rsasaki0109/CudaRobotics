name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Docs-only PRs skip the CUDA build (repo-checks.yml still runs). Pushes to
    # master always build, because they produce the commit-bound evidence.
    paths-ignore:
      - "docs/**"
      - "paper/**"
      - "gif/**"
      - "**/*.md"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: "12.0.0"
          method: network

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            cmake \
            libeigen3-dev \
            libopencv-dev \
            python3-matplotlib \
            python3-numpy

      # Compiler cache across runs: master builds save it, every PR restores the
      # newest one, so unchanged translation units are not recompiled.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-cuda12.0-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-cuda12.0-

      - name: Configure
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j$(nproc)
          ccache --show-stats

      # GPU tests (label "gpu") require NVIDIA GPU and cannot run in CI

      - name: Run Python tests
        run: cd build && ctest --output-on-failure --label-regex python -j$(nproc)

      - name: Run CPU tests
        run: cd build && ctest --output-on-failure --label-regex cpu -j$(nproc)

      - name: Create commit-bound Build evidence
        if: github.event_name != 'pull_request'
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git clean -fdx
          test -z "$(git status --porcelain)"
          python scripts/release_ci_evidence.py \
            --output build/github_build_ci_evidence.json \
            --gate github_build \
            --workflow "$GITHUB_WORKFLOW" \
            --check clean_checkout \
            --check cmake_configure \
            --check cuda_build \
            --check python_ctest \
            --check cpu_ctest
          python scripts/validate_release_ci.py \
            build/github_build_ci_evidence.json \
            --gate github_build \
            --commit "$GITHUB_SHA"

      - name: Upload commit-bound Build evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-build-ci-evidence-${{ github.sha }}
          path: build/github_build_ci_evidence.json
          if-no-files-found: error
